name: stats
on:
  push:
    branches: [main]
    paths: ['src/matched/**', 'tools/count_matched.py']
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/count_matched.py --stats docs/stats.json
      - name: Commit stats
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add docs/stats.json
          git diff --cached --quiet || (git commit -m "Actualiza docs/stats.json [skip ci]" && git push)
